# Nightly build: builds the wsams/latex image and pushes it to Harbor.
#
# Required repository secrets:
#   HARBOR_HOST      – registry hostname only, e.g. harbor.example.com
#   HARBOR_PROJECT   – project path within Harbor, e.g. wsams
#                      The final image will be  $HARBOR_HOST/$HARBOR_PROJECT/latex
#   HARBOR_USERNAME  – Harbor robot-account or user name
#   HARBOR_PASSWORD  – Harbor robot-account secret or password
#
# siamtex compatibility:
#   The produced image includes latexmk, biber, xelatex, lualatex, and a
#   non-root texuser (uid 10001) so siamtex's docker/tex-worker/Dockerfile can
#   reference it as a base image instead of texlive/texlive:latest-small.

name: Nightly Build & Push to Harbor

on:
  schedule:
    # 02:00 UTC every day
    - cron: "0 2 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: latex

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.HARBOR_HOST }}/${{ secrets.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY-MM-DD'}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
